stages:
  - scrape
  - deploy

# -----------------------------------------------------------------------
# Daily job scrape - runs on a GitLab scheduled pipeline (07:00 UTC).
# Set up at: CI/CD > Schedules > "0 7 * * *" targeting main.
# -----------------------------------------------------------------------
scrape:
  stage: scrape
  image: python:3.11-slim
  only:
    - schedules
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  variables:
    GIT_HTTP_LOW_SPEED_LIMIT: "1000"
    GIT_HTTP_LOW_SPEED_TIME: "30"
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install --quiet requests beautifulsoup4 lxml
    - python scraper/scrape.py
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${CI_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      # Retry git network ops up to 3 times to survive transient gitlab.com blips
      gitretry() {
        for i in 1 2 3; do
          "$@" && return 0
          echo "git op failed (attempt $i), retrying in $((i*10))s..."
          sleep $((i*10))
        done
        echo "git op failed after 3 attempts"; return 1
      }

      gitretry git fetch origin main
      git checkout main
      cp scraper/jobs.json /tmp/jobs.json
      git checkout main -- scraper/jobs.json
      cp /tmp/jobs.json scraper/jobs.json
      git add scraper/jobs.json

      if git diff --staged --quiet; then
        echo "No changes to commit."
      else
        git commit -m "chore: daily job scrape $(date -u +'%Y-%m-%d %H:%M UTC')"
        gitretry git push origin main
      fi
  artifacts:
    paths:
      - scraper/jobs.json
    expire_in: 2 hrs

# -----------------------------------------------------------------------
# Pages deployment - runs on every push to main.
# Uses the modern `pages:` keyword + `publish:` directive required by
# GitLab Pages. The `pages` job builds the artifact; GitLab's internal
# `pages:deploy` step then publishes it.
# -----------------------------------------------------------------------
pages:
  stage: deploy
  image: alpine:latest
  interruptible: true
  script:
    - rm -rf public
    - mkdir public
    - find . -maxdepth 1 -mindepth 1 ! -name public ! -name '.git' ! -name '.gitlab-ci.yml' ! -name 'README.md' -exec cp -r {} public/ \;
  pages: true
  publish: public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
